<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KyMind 导图</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#26334d;background:#f7f9fc}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}button,input{font:inherit}header{height:58px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #dfe5ef;background:#fff}header h1{max-width:min(36vw,480px);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}header small{display:block;margin-top:2px;color:#7b879b;font-size:11px}.tools{display:flex;align-items:center;gap:6px;margin-left:auto}.tools input{width:min(260px,28vw);height:34px;padding:0 10px;border:1px solid #d7ddea;border-radius:6px;outline:none}.tools input:focus{border-color:#4f6fe8;box-shadow:0 0 0 3px #4f6fe81c}.tools button,.side button{height:34px;padding:0 11px;border:1px solid #d7ddea;border-radius:6px;background:#fff;color:#526078;cursor:pointer}.tools button:hover,.side button:hover{border-color:#9db1ee;background:#f2f5ff;color:#3154bd}.app{height:calc(100% - 58px);display:grid;grid-template-columns:minmax(0,1fr) 300px}.stage-wrap{position:relative;min-width:0;overflow:hidden;background:#f7f9fc}.stage{width:100%;height:100%;touch-action:none;cursor:grab}.stage.is-panning{cursor:grabbing}.edge{fill:none;stroke:#aebbd4;stroke-width:1.6}.node rect{fill:#fff;stroke:#adbcda;stroke-width:1.2}.node.root rect{fill:#4f6fe8;stroke:#4f6fe8}.node text{fill:#263858;font-size:13px;pointer-events:none}.node.root text{fill:#fff;font-weight:700}.node.selected rect{stroke:#2563eb;stroke-width:2}.node.match rect{stroke:#f59e0b;stroke-width:2}.expander{fill:#fff;stroke:#8ea0c3;cursor:pointer}.expander-text{fill:#526078;font-size:12px;pointer-events:none}.side{min-width:0;padding:16px;border-left:1px solid #dfe5ef;background:#fff;overflow:auto}.side h2{margin:0 0 8px;font-size:15px}.side .meta{display:grid;gap:7px;margin:0 0 14px;color:#69758b;font-size:12px}.side .meta span{overflow-wrap:anywhere}.note{min-height:88px;padding:11px;border:1px solid #e1e6ef;border-radius:7px;background:#fafbfe;white-space:pre-wrap;overflow-wrap:anywhere;color:#46546d;font-size:13px;line-height:1.7}.node-image{display:block;max-width:100%;max-height:220px;margin:10px 0 0;border:1px solid #e1e6ef;border-radius:6px;object-fit:contain}.node-link{display:block;margin-top:10px;color:#2563eb;font-size:12px;overflow-wrap:anywhere}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.side-actions .wide{grid-column:1/-1}.status{position:absolute;left:12px;bottom:12px;padding:6px 9px;border:1px solid #dfe5ef;border-radius:6px;background:#ffffffeb;color:#75829a;font-size:11px;box-shadow:0 2px 8px #1e28400c}.empty{display:grid;height:100%;place-items:center;color:#75829a}.hidden{display:none!important}@media(max-width:760px){header{height:auto;min-height:58px;flex-wrap:wrap}.tools{width:100%;margin-left:0}.tools input{flex:1;width:auto}.app{height:calc(100% - 100px);grid-template-columns:1fr}.side{position:absolute;z-index:5;right:8px;bottom:8px;width:min(300px,calc(100vw - 16px));max-height:52vh;border:1px solid #dfe5ef;border-radius:8px;box-shadow:0 12px 34px #1e28402a}.side.is-collapsed{display:none}}
  </style>
</head>
<body>
  <header><div><h1 id="title">KyMind 导图</h1><small id="subtitle">正在读取发布包</small></div><div class="tools"><input id="search" type="search" placeholder="搜索节点或备注"><button id="prev" type="button" title="上一个结果">↑</button><button id="next" type="button" title="下一个结果">↓</button><button id="expand" type="button">展开</button><button id="collapse" type="button">收起</button><button id="fit" type="button">适配</button></div></header>
  <div class="app"><main class="stage-wrap"><svg id="stage" class="stage" aria-label="只读思维导图"><g id="viewport"></g></svg><div id="empty" class="empty">正在加载导图...</div><div id="status" class="status">0 个节点</div></main><aside id="side" class="side"><h2 id="node-title">项目信息</h2><div class="meta"><span id="author">作者：-</span><span id="version">版本：-</span><span id="repository">仓库：-</span></div><div id="note" class="note">选择节点后查看备注。</div><img id="node-image" class="node-image hidden" alt="节点图片"><a id="node-link" class="node-link hidden" target="_blank" rel="noopener noreferrer"></a><div class="side-actions"><button id="zoom-out" type="button">缩小</button><button id="zoom-in" type="button">放大</button><button id="clone" class="wide" type="button">复制复刻链接</button><button id="download" class="wide" type="button">下载源数据</button></div></aside></div>
  <script>
  (()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),viewport=$('viewport');let manifest={},scene={nodes:[],edges:[]},scale=1,tx=30,ty=30,panning=false,start=null,selected='',matches=[],matchIndex=-1;const collapsed=new Set();
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function visible(node){let p=node.parentId;while(p){if(collapsed.has(p))return false;const parent=scene.nodeMap[p];p=parent&&parent.parentId}return true}function applyTransform(){viewport.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);$('status').textContent=`${scene.nodes.filter(visible).length} 个节点 · ${Math.round(scale*100)}%`}
  function draw(){if(!scene.nodes.length)return;const visibleIds=new Set(scene.nodes.filter(visible).map(n=>n.id));let html=scene.edges.filter(e=>visibleIds.has(e.from)&&visibleIds.has(e.to)).map(e=>`<path class="edge" d="${esc(e.path)}"/>`).join('');html+=scene.nodes.filter(n=>visibleIds.has(n.id)).map(n=>{const lines=(n.lines&&n.lines.length?n.lines:[n.text||'未命名节点']);const text=lines.map((line,i)=>`<tspan x="${n.x+12}" y="${n.y+20+i*17}">${esc(line)}</tspan>`).join('');const exp=n.hasChildren?`<circle class="expander" data-expand="${esc(n.id)}" cx="${n.x+n.width+10}" cy="${n.y+n.height/2}" r="8"/><text class="expander-text" x="${n.x+n.width+10}" y="${n.y+n.height/2+4}" text-anchor="middle">${collapsed.has(n.id)?'+':'−'}</text>`:'';return `<g class="node${n.depth===0?' root':''}${selected===n.id?' selected':''}${matches.includes(n.id)?' match':''}" data-node="${esc(n.id)}"><rect x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="7"/><text>${text}</text>${exp}</g>`}).join('');viewport.innerHTML=html;applyTransform()}
  function select(id){const n=scene.nodeMap[id];if(!n)return;selected=id;$('node-title').textContent=n.text||'未命名节点';$('note').textContent=n.noteText||'此节点没有备注。';const image=$('node-image');if(n.image){image.src=n.image;image.classList.remove('hidden')}else{image.removeAttribute('src');image.classList.add('hidden')}const link=$('node-link');if(n.link){link.href=n.link;link.textContent=n.link;link.classList.remove('hidden')}else link.classList.add('hidden');draw()}
  function fit(){const nodes=scene.nodes.filter(visible);if(!nodes.length)return;const minX=Math.min(...nodes.map(n=>n.x)),minY=Math.min(...nodes.map(n=>n.y)),maxX=Math.max(...nodes.map(n=>n.x+n.width)),maxY=Math.max(...nodes.map(n=>n.y+n.height));const box=stage.getBoundingClientRect(),w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY);scale=Math.max(.18,Math.min(2.2,Math.min((box.width-50)/w,(box.height-50)/h)));tx=(box.width-w*scale)/2-minX*scale;ty=(box.height-h*scale)/2-minY*scale;applyTransform()}
  function zoom(f,cx,cy){const rect=stage.getBoundingClientRect(),x=(cx==null?rect.width/2:cx-rect.left),y=(cy==null?rect.height/2:cy-rect.top),old=scale;scale=Math.max(.18,Math.min(3,scale*f));tx=x-(x-tx)*(scale/old);ty=y-(y-ty)*(scale/old);applyTransform()}
  function search(){const q=$('search').value.trim().toLowerCase();matches=q?scene.nodes.filter(n=>(`${n.text||''} ${n.noteText||''}`).toLowerCase().includes(q)).map(n=>n.id):[];matchIndex=matches.length?0:-1;if(matchIndex>=0){collapsed.clear();select(matches[0]);center(matches[0])}else draw()}
  function center(id){const n=scene.nodeMap[id];if(!n)return;const box=stage.getBoundingClientRect();tx=box.width/2-(n.x+n.width/2)*scale;ty=box.height/2-(n.y+n.height/2)*scale;applyTransform()}
  stage.addEventListener('pointerdown',e=>{const exp=e.target.closest('[data-expand]');if(exp){const id=exp.getAttribute('data-expand');collapsed.has(id)?collapsed.delete(id):collapsed.add(id);draw();return}const node=e.target.closest('[data-node]');if(node){select(node.getAttribute('data-node'));return}panning=true;start={x:e.clientX,y:e.clientY,tx,ty};stage.setPointerCapture(e.pointerId);stage.classList.add('is-panning')});stage.addEventListener('pointermove',e=>{if(!panning)return;tx=start.tx+e.clientX-start.x;ty=start.ty+e.clientY-start.y;applyTransform()});stage.addEventListener('pointerup',()=>{panning=false;stage.classList.remove('is-panning')});stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
  $('search').addEventListener('input',search);$('prev').onclick=()=>{if(!matches.length)return;matchIndex=(matchIndex-1+matches.length)%matches.length;select(matches[matchIndex]);center(matches[matchIndex])};$('next').onclick=()=>{if(!matches.length)return;matchIndex=(matchIndex+1)%matches.length;select(matches[matchIndex]);center(matches[matchIndex])};$('expand').onclick=()=>{collapsed.clear();draw();fit()};$('collapse').onclick=()=>{collapsed.clear();scene.nodes.filter(n=>n.depth===1&&n.hasChildren).forEach(n=>collapsed.add(n.id));draw();fit()};$('fit').onclick=fit;$('zoom-in').onclick=()=>zoom(1.2);$('zoom-out').onclick=()=>zoom(.82);window.addEventListener('resize',fit);
  Promise.all([fetch('manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(new Error('manifest.json 读取失败'))),fetch('scene/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(new Error('scene/index.json 读取失败')))]).then(([m,s])=>{manifest=m||{};scene=s||{};scene.nodes=Array.isArray(scene.nodes)?scene.nodes:[];scene.edges=Array.isArray(scene.edges)?scene.edges:[];scene.nodeMap=Object.fromEntries(scene.nodes.map(n=>[n.id,n]));$('title').textContent=manifest.title||'KyMind 导图';document.title=`${$('title').textContent} - KyMind`;$('subtitle').textContent=[manifest.author&&manifest.author.githubLogin,manifest.branch,manifest.publishedAt].filter(Boolean).join(' · ');$('author').textContent=`作者：${manifest.author&&manifest.author.githubLogin||'-'}`;$('version').textContent=`版本：${manifest.schemaVersion||1}`;$('repository').textContent=`仓库：${manifest.repository||'-'}`;$('empty').classList.add('hidden');if(!(manifest.capabilities&&manifest.capabilities.clone))$('clone').classList.add('hidden');if(!(manifest.capabilities&&manifest.capabilities.downloadSource))$('download').classList.add('hidden');draw();fit();if(scene.nodes[0])select(scene.nodes[0].id)}).catch(error=>{$('empty').textContent=error.message;$('subtitle').textContent='发布包加载失败'});
  $('clone').onclick=()=>{const base=new URL('.',location.href).href,url=`kymind://clone?source=${encodeURIComponent(base)}`;navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(url).then(()=>{$('clone').textContent='已复制复刻链接'}):prompt('复制复刻链接',url)};$('download').onclick=()=>{location.href=manifest.sourceDocument||'source/document.json'};
  })();
  </script>
</body>
</html>
